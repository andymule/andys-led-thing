<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Grid</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 640px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .canvas-wrapper {
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(100, 100, 255, 0.1);
      line-height: 0;
    }

    canvas {
      width: 100%;
      max-width: 512px;
      height: auto;
      display: block;
    }

    /* --- Control sections --- */

    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .control-section {
      background: #16161e;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 0.75rem 1rem 0.6rem;
    }

    .control-section h2 {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }

    #global-controls h2 { color: #888; }

    .control-section .control-row {
      display: grid;
      gap: 0.6rem 1rem;
    }

    #global-controls .control-row { grid-template-columns: repeat(5, 1fr); }
    #channel-controls .control-row { grid-template-columns: repeat(7, 1fr); column-gap: 0.5rem; }

    .control-group {
      min-width: 0;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #666;
      margin-bottom: 0.15rem;
    }

    .control-value {
      color: #aaa;
      font-variant-numeric: tabular-nums;
    }

    #channel-controls .param-name {
      cursor: pointer;
      transition: color 0.15s;
    }

    #channel-controls .param-name.animating {
      color: var(--ch-border);
      text-decoration: underline;
    }

    /* --- Channel toggle --- */

    .channel-toggle {
      display: flex;
      background: #16161e;
      border: 1px solid #2a2a35;
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
    }

    .ch-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #555;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.4rem 0;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .ch-btn:hover { color: #999; }

    .ch-btn[data-ch="0"].active { background: rgba(255, 68, 68, 0.2); color: #ff6666; }
    .ch-btn[data-ch="1"].active { background: rgba(68, 204, 68, 0.2); color: #66dd66; }
    .ch-btn[data-ch="2"].active { background: rgba(68, 136, 255, 0.2); color: #66aaff; }

    /* --- Channel controls dynamic theming --- */

    #channel-controls {
      --ch-bg: #ff4444;
      --ch-border: #ff6666;
      border-color: var(--ch-border);
    }

    #channel-controls input::-webkit-slider-thumb {
      background: var(--ch-bg);
      border-color: var(--ch-border);
    }

    #channel-controls input::-moz-range-thumb {
      background: var(--ch-bg);
      border-color: var(--ch-border);
    }

    /* --- Grid size footer --- */

    .grid-size {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.65rem;
      color: #555;
    }

    .grid-size label {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .grid-size input[type="number"] {
      width: 3rem;
      background: #0a0a0f;
      border: 1px solid #2a2a35;
      border-radius: 4px;
      color: #e0e0e8;
      font-size: 0.7rem;
      padding: 0.15rem 0.2rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .grid-size input[type="number"]:focus {
      outline: none;
      border-color: #555;
    }

    /* --- Range inputs --- */

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: #2a2a35;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #888;
      border: 2px solid #aaa;
      transition: background 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #aaa;
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #aaa;
      background: #888;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>LED Grid</h1>
    <div class="canvas-wrapper">
      <canvas id="led-canvas" width="512" height="512"></canvas>
    </div>
    <div class="controls">
      <div id="global-controls" class="control-section">
        <h2>Global</h2>
        <div class="control-row"></div>
      </div>
      <div class="channel-toggle">
        <button class="ch-btn active" data-ch="0">Red</button>
        <button class="ch-btn" data-ch="1">Green</button>
        <button class="ch-btn" data-ch="2">Blue</button>
      </div>
      <div id="channel-controls" class="control-section">
        <div class="control-row"></div>
      </div>
    </div>
    <div class="grid-size">
      <label>X <input type="number" id="grid-x" value="32" min="2" max="128"></label>
      <label>Y <input type="number" id="grid-y" value="32" min="2" max="128"></label>
    </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
